services:
  - type: web
    name: age-tracker-api
    runtime: go
    plan: free
    branch: main
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /
    envVars:
      # Postgres connection string, e.g. from Neon: postgres://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
